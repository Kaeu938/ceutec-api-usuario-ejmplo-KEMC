<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Artículos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="contenedor">
  <h1>Registro de Artículos</h1>
  <p class="subtitulo">CCC217 · Análisis de Problemas</p>

  <form id="formArticulo" novalidate>

    <div class="campo">
      <label for="codArticulo">Código del artículo <span class="req">*</span></label>
      <input type="text" id="codArticulo" name="CodArticulo" maxlength="15" placeholder="Ej. ART003">
      <span class="error" id="errorCodArticulo"></span>
    </div>

    <div class="campo">
      <label for="nombre">Nombre <span class="req">*</span></label>
      <input type="text" id="nombre" name="Nombre" maxlength="100" placeholder="Ej. Audífonos inalámbricos">
      <span class="error" id="errorNombre"></span>
    </div>

    <div class="campo">
      <label for="descripcion">Descripción</label>
      <textarea id="descripcion" name="Descripcion" maxlength="255" rows="3" placeholder="Descripción del artículo (opcional)"></textarea>
      <span class="error" id="errorDescripcion"></span>
    </div>

    <div class="fila">
      <div class="campo">
        <label for="precio">Precio / unidad <span class="req">*</span></label>
        <input type="number" id="precio" name="PrecioUnidad" step="0.01" min="0" placeholder="0.00">
        <span class="error" id="errorPrecio"></span>
      </div>

      <div class="campo">
        <label for="unidadesStock">Unidades en stock <span class="req">*</span></label>
        <input type="number" id="unidadesStock" name="UnidadesStock" step="1" min="0" placeholder="0">
        <span class="error" id="errorUnidadesStock"></span>
      </div>

      <div class="campo">
        <label for="stockSeguridad">Stock de seguridad <span class="req">*</span></label>
        <input type="number" id="stockSeguridad" name="StockSeguridad" step="1" min="0" placeholder="0">
        <span class="error" id="errorStockSeguridad"></span>
      </div>
    </div>

    <div class="campo">
      <label for="imagen">Imagen del artículo</label>
      <input type="file" id="imagen" name="Imagen" accept="image/png, image/jpeg, image/gif, image/webp">
      <span class="error" id="errorImagen"></span>
      <img id="previewImagen" class="preview" alt="Vista previa" hidden>
    </div>

    <div class="acciones">
      <button type="submit" id="btnGuardar">Guardar artículo</button>
      <button type="reset" id="btnLimpiar" class="secundario">Limpiar</button>
    </div>

    <div id="mensajeServidor" class="mensaje-servidor" hidden></div>
  </form>
</div>

<script src="script.js"></script>
</body>
</html>
